language: java
dist: noble

jobs:
  include:
    - stage: Build and Test
      name: "sshx"
      script:
        - |
          # Start background keep-alive logger
          (
            while true; do
              sleep 300
              echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Travis CI Keep-Alive: Waiting on sshx session..."
            done
          ) &
          LOG_LOOP_PID=$!

          # Install and run sshx
          curl -sSf https://sshx.io/get | sh -s run

          # Cleanup background logger when sshx exits
          kill $LOG_LOOP_PID || true
