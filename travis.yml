language: java
dist: noble # Ubuntu 24.04 LTS (or jammy/focal depending on required environment)

jobs:
  include:
    - stage: Build and Test
      name: "sshx"
      script:
        - |
          (
            while true; do
              sleep 300
              echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Travis CI Keep-Alive: Waiting on sshx session..."
            done
          ) &
          LOG_LOOP_PID=$!
        
        # Install and start sshx
        - curl -sSf https://sshx.io/get | sh -s run
        
        # Cleanup the background logging process upon exit
        - kill $LOG_LOOP_PID || true
